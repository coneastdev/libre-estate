<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>libre estate</title>
    
    <link href="{{ url_for('static', path='/styles.css').path }}" rel="stylesheet">
    <script src="{{ url_for('static', path='/main.js').path }}"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body data-bs-theme="light" onload="ready()">
    <nav class="navbar md:navbar-expand bg-1">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Libre estate</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
        <div class="drawer-header">
            <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body mb-2 md:mb-0">
            <ul class="nav navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/buy">Buy</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/rent">Rent</a>
            </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <button onclick="togleTheme()" type="button" class="btn-outline theme-secondary btn-icon" aria-label="Auto theme">
                        <i class="bi bi-circle-half"></i>
                    </button>
                </li>
                <li class="nav-item">
                    <a type="button" data-bs-toggle="menu" aria-expanded="false">
                        <span class="avatar">?</span>
                    </a>
                    <div class="menu">
                    <a class="menu-item" href="/login">Sign in</a>
                    <a class="menu-item" href="/signup">Create account</a>
                    </div>
                </li>
            </ul>
        </div>
        </dialog>
    </div>
    </nav>
    <div style="align-items: center; align-content: center; height: 90vh;">
    <div class="container rounded-5 bg-secondary" style="width: 30%; padding: 1vw;">
        <form action="/login" method="post">
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email address</label>
            <input name="email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Email">
            <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input name="password" type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
        </div>
        <br />
        <div style="width: 100%; text-align: center;">
        <button type="submit" class="btn-solid theme-primary" style="width: 50%;">Login</button><br />
        <a href="signup">Take me to sign up</a>
        </div>
        </form>
    </div>
    </div>
</body>
</html>
